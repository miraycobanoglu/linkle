<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkle - Profiller</title>
      <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Enriqueta:wght@400;600;700&family=Merriweather+Sans:wght@300;400;500;600;700&family=Rochester&display=swap" rel="stylesheet">
  
  <!-- Sadece Bootstrap Grid -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
      <header class="lk-navbar">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between">

      <div class="logo-search d-flex align-items-center">
      <!-- Logo -->
      <a href="index.html" class="lk-logo-div d-flex">
        <img src="images/logo.svg" alt="Linkle Logo" class="lk-logo">
        <span class="lk-brand-name">L<span>in</span>kle</span>
      </a>

      <!-- Arama -->
      <div class="search-profiller d-flex align-items-center">

        <div class="lk-search-box">
          <span class="lk-search-icon"><img src="images/search.svg" alt="Search Icon"></span>
          <input type="search" placeholder="Search..." id="searchInput">
        </div>
             <!-- Profiller -->
      <a href="profiles.html" class="lk-nav-profiles">Profiller</a>
      </div>
      </div>

      <!-- Sağ Menü: Profil -->
      <div class="lk-account-dropdown">
        <div class="hesap d-flex align-items-center cursor-pointer" id="dropdownToggle">

          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar" class="lk-avatar">

          <div class="hesap-logo">
          <p class="lk-account-text">Hesap </p>
          <img class="lk-account-icon lk-my-avatar" id="hesap-profile" src="images/Vector.svg" alt="Dropdown Icon">
          </div>
        </div>

          <div class="lk-dropdown-menu" id="dropdownMenu">
          <a href="sayfam.html" class="dropdown-icerik d-flex align-items-center">
            <img src="images/account_circle.svg" alt="Avatar" class="dropdown-profil width:29 height:29">
            <p>Profil</p>
          </a>
          <a href="#" class="dropdown-icerik d-flex align-items-center gap-2">
            <img src="images/brightness_auto.svg" alt="Settings" class="dropdown-ayarlar width:29 height:29">
            <p>Ayarlar</p>
          </a>
          <a href="#" class="dropdown-icerik d-flex align-items-center gap-2">
            <img src="images/brightness_6.svg" alt="Mod" class="dropdown-mod width:29 height:29">
            <p>Mod</p>
          </a>
    </div>
      </div>
  </header>

    <!-- Geri Oku -->
      <a href="profiles.html" class="profiles-geri">
        <img src="images/geri.svg" alt="Geri" class="profiles-geri-icon">
      </a>
   
      <!-- SAYFAM (KENDİ PROFİLİM) ANA ALAN -->
<main class="container my-4">
  <section class="lk-my-profile-header">
    
    <!-- Sol Taraf: Avatar ve Kullanıcı Adı -->
    <div class="lk-my-avatar-wrapper">
      <div class="lk-my-avatar-border">
        <img src="" alt="Profil Resmi" class="lk-my-avatar">
      </div>
      <span class="lk-my-username"></span>
    </div>

    <!-- Sağ Taraf: Detaylar, İstatistikler ve İşlem Butonları -->
    <div class="lk-my-profile-details">
      
      <!-- İsim ve Butonlar Satırı -->
      <div class="lk-my-profile-top-row">
        <h1 class="lk-my-profile-name"></h1>
        
        <div class="lk-my-actions">
          <button type="button" class="btn lk-btn-outline-purple" id="btnEditProfile">Profili Düzenle</button>
          <button type="button" class="btn lk-btn-purple" id="btnCreatePost">Paylaşım Yap</button>
        </div>
      </div>

      <!-- İstatistikler ve Sosyal Medya -->
      <div class="lk-my-stats-row">
        <div class="lk-my-stat-item">
          <strong class="paylasim-sayi"></strong> <span>paylaşım</span>
        </div>
        <div class="lk-my-stat-item">
          <strong class="takipci-sayi"></strong> <span>followers</span>
        </div>
        <div class="lk-my-stat-item">
          <strong class="takip-edilen-sayi">280</strong> <span>following</span>
        </div>
      </div>

      <!-- Instagram İkonu -->
      <div class="lk-my-social-row">
        <a href="#" target="_blank" class="lk-my-social-link">
          <img src="images/instagram-icon.jpg" alt="Instagram" width="24" height="24">
        </a>
      </div>

    </div>
  </section>

  <!-- Gönderiler Grid Alanı -->
  <section class="lk-my-posts-grid my-5">
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">
      
      <!--Gönderiler -->
      <div class="col">
        <div class="lk-my-post-card">
          <a href="detail.html"><img src="images/görsel.jpeg" alt="Gönderi" class="lk-my-post-img"></a>
        </div>
      </div>

      <div class="col">
        <div class="lk-my-post-card">
          <a href="detail.html"><img src="images/görsel.jpeg" alt="Gönderi" class="lk-my-post-img"></a>
        </div>
      </div>

      <div class="col">
        <div class="lk-my-post-card">
          <a href="detail.html"><img src="images/görsel.jpeg" alt="Gönderi" class="lk-my-post-img"></a>
        </div>
      </div>

      <div class="col">
        <div class="lk-my-post-card">
          <a href="detail.html"><img src="images/görsel.jpeg" alt="Gönderi" class="lk-my-post-img"></a>
        </div>
      </div>

      <div class="col">
        <div class="lk-my-post-card">
         <a href="detail.html"><img src="images/görsel.jpeg" alt="Gönderi" class="lk-my-post-img"></a>
        </div>
      </div>

    </div>
  </section>
</main>

<!--PAYLAŞIM YAP MODALI -->
<div class="lk-create-post-overlay" id="createPostModal">
  <div class="lk-create-post-modal">
    
    <!-- Kapatma Butonu -->
    <button type="button" class="btn-close lk-modal-close-btn" id="btnCloseCreatePost" aria-label="Kapat"></button>

    <form id="formCreatePost">
      
      <!-- Etiket-->
      <div class="form-group">
        <label for="postTagInput">Etiket</label>
        <div class="input-with-icon">
          <img src="images/tag.svg" alt="Etiket" class="input-icon">
          <input 
            type="text" 
            id="postTagInput" 
            name="tagCategory" 
            class="lk-input-field" 
            placeholder="Ürün başlığı"
            required
          >
        </div>
      </div>

      <!-- Marka -->
      <div class="form-group">
        <label for="postBrandInput">Marka</label>
        <input 
          type="text" 
          id="postBrandInput" 
          name="brand" 
          class="lk-input-field" 
          placeholder="Marka"
        >
      </div>

      <!-- Link -->
      <div class="form-group">
        <label for="postLinkInput">Link</label>
        <input 
          type="url" 
          id="postLinkInput" 
          name="productLink" 
          class="lk-input-field" 
          placeholder="Link"
        >
      </div>

      <!-- Görsel Yükleme -->
      <div class="form-group">
        <label>Görsel</label>
        <div class="lk-input-field d-flex align-items-center">
          <input type="file" id="postImageUpload" name="postImage" accept="image/*" hidden>
          <label for="postImageUpload" class="lk-upload-field m-0">
            <img src="images/upload.svg" alt="Yükle">
            <span id="uploadFileName">Yükle</span>
          </label>
        </div>
      </div>

      <!-- Gönder/Ekle Butonu -->
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn-submit-post">Paylaş</button>
      </div>

    </form>
  </div>
</div>

<!-- 5.1.1 ONAYLANDI MODALI -->
<div class="lk-status-overlay" id="statusModal">
  <div class="lk-status-modal">
    
    <!-- Yüklenme ve Onay İkon Alanı -->
    <div class="lk-status-icon-wrapper" id="statusIconWrapper">
      <!-- Dönme Animasyonlu Çember -->
      <div class="lk-spinner"></div>
      
      <!-- Yeşil Tik İkonu (Başlangıçta Gizli) -->
      <svg class="lk-check-icon d-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <!-- Durum Metni -->
    <p class="lk-status-text" id="statusText">" Paylaşım Yükleniyor... "</p>

  </div>
</div>


    <script type="module" src="js/app.js"></script>
  </body>
  </html>
