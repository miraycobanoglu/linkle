<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linkle</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Enriqueta:wght@400;600;700&family=Merriweather+Sans:wght@300;400;500;600;700&family=Rochester&display=swap" rel="stylesheet">
  
  <!-- Sadece Bootstrap Grid -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="lk-navbar">
    <div class="container-fluid px-5 d-flex align-items-center justify-content-between">
      
      <!-- Sol: SVG Logo + Linkle Metni -->
      <a href="index.html" class="lk-logo-div d-flex align-items-center">
        <img src="images/join.svg" alt="Linkle Logo" class="lk-logo">
        <span class="lk-brand-name">L<span>in</span>kle</span>
      </a>

      <!-- Arama Barı -->
      <div class="lk-search-box">
        <span class="lk-search-icon">🔍</span>
        <input type="search" placeholder="Search..." id="searchInput">
      </div>

      <!-- Orta Menü: Profiller (Rochester Fontu) -->
      <a href="profiles.html" class="lk-nav-profiles">Profiller</a>

      <!-- Sağ Menü: Profil Avatar + Hesap Dropdown -->
      <div class="lk-account-dropdown">
        <div class="d-flex align-items-center gap-2 cursor-pointer" id="dropdownToggle">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar" class="lk-avatar">
          <span class="lk-account-text">Hesap <span>∨</span></span>
        </div>
        
        <div class="lk-dropdown-menu" id="dropdownMenu">
          <a href="profile.html?user=me">Profil</a>
          <a href="#">Ayarlar</a>
          <a href="#">Mod</a>
        </div>
      </div>

    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="container-fluid px-5 my-4">
    
    <!-- Hero Banner Kutusu -->
    <section class="lk-hero-card mb-4">
      <p>
        "Stil sahiplerinin paylaştığı kombinleri keşfet, orijinal parçaların linklerine ulaş, yorumunu ekle veya topluluğun önerdiği bütçe dostu muadilleri incele."
      </p>
    </section>

    <!-- Filtre Dropdown Butonu -->
    <section class="mb-4">
      <div class="lk-filter-dropdown">
        <button class="lk-filter-btn" id="filterBtn">
          <span>En Yeniler</span> <span>∨</span>
        </button>
      </div>
    </section>

    <!-- Kombin Kartları Grid (5'li Yan Yana Yerleşim) -->
    <section class="row g-4" id="comboGrid">
      
      <!-- Örnek Kart 1 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-2-4">
        <div class="lk-card">
          <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" alt="Kombin" class="lk-card-img">
          <a href="detail.html?id=1" class="lk-btn-card-incele">İncele</a>
        </div>
      </div>

      <!-- Örnek Kart 2 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-2-4">
        <div class="lk-card">
          <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" alt="Kombin" class="lk-card-img">
          <a href="detail.html?id=2" class="lk-btn-card-incele">İncele</a>
        </div>
      </div>

      <!-- Örnek Kart 3 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-2-4">
        <div class="lk-card">
          <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" alt="Kombin" class="lk-card-img">
          <a href="detail.html?id=3" class="lk-btn-card-incele">İncele</a>
        </div>
      </div>

      <!-- Örnek Kart 4 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-2-4">
        <div class="lk-card">
          <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" alt="Kombin" class="lk-card-img">
          <a href="detail.html?id=4" class="lk-btn-card-incele">İncele</a>
        </div>
      </div>

      <!-- Örnek Kart 5 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-2-4">
        <div class="lk-card">
          <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" alt="Kombin" class="lk-card-img">
          <a href="detail.html?id=5" class="lk-btn-card-incele">İncele</a>
        </div>
      </div>

    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
