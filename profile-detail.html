<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- JS yüklenene kadar görünecek varsayılan başlık -->
  <title>Kombin Detayı | Linkle</title>
  <meta name="description" content="Kombin detayları, kullanılan markalar ve uygun fiyatlı muadil alternatifleri.">

  <link rel="icon" href="images/logo.svg" type="image/x-icon">
      <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Enriqueta:wght@400;600;700&family=Merriweather+Sans:wght@300;400;500;600;700&family=Rochester&display=swap" rel="stylesheet">
  
  <!-- Sadece Bootstrap Grid -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
      <header class="lk-navbar">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between">

      <div class="logo-search d-flex align-items-center">
      <!-- Logo -->
      <a href="index.html" class="lk-logo-div d-flex">
        <img src="images/logo.svg" alt="Linkle Logo" class="lk-logo">
        <span class="lk-brand-name">L<span>in</span>kle</span>
      </a>

      <!-- Arama -->
      <div class="search-profiller d-flex align-items-center">

        <div class="lk-search-box">
          <span class="lk-search-icon"><img src="images/search.svg" alt="Search Icon"></span>
          <input type="search" placeholder="Search..." id="searchInput">
        </div>
             <!-- Profiller -->
      <a href="profiles.html" class="lk-nav-profiles">Profiller</a>
      </div>
      </div>

      <!-- Sağ Menü: Profil -->
      <div class="lk-account-dropdown">
        <div class="hesap d-flex align-items-center cursor-pointer" id="dropdownToggle">

          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar" class="lk-avatar">

          <div class="hesap-logo">
          <p class="lk-account-text">Hesap </p>
          <img class="lk-account-icon" src="images/Vector.svg" alt="Dropdown Icon">
          </div>
        </div>

          <div class="lk-dropdown-menu" id="dropdownMenu">
          <a href="sayfam.html" class="dropdown-icerik d-flex align-items-center">
            <img src="images/account_circle.svg" alt="Avatar" class="dropdown-profil width:29 height:29">
            <p>Profil</p>
          </a>
          <a href="#" class="dropdown-icerik d-flex align-items-center gap-2">
            <img src="images/brightness_auto.svg" alt="Settings" class="dropdown-ayarlar width:29 height:29">
            <p>Ayarlar</p>
          </a>
          <a href="#" class="dropdown-icerik d-flex align-items-center gap-2">
            <img src="images/brightness_6.svg" alt="Mod" class="dropdown-mod width:29 height:29">
            <p>Mod</p>
          </a>
    </div>
      </div>
  </header>

    <!-- Geri Oku -->
      <a href="profiles.html" class="profiles-geri">
        <img src="images/geri.svg" alt="Geri" class="profiles-geri-icon">
      </a>


      <!-- PROFİL DETAY ANA İÇERİK -->
  <main class="container my-4">

    <!-- PROFİL HEADER (AVATAR & BİLGİLER) -->
    <section class="lk-profile-header">
      <div class="lk-profile-avatar-wrapper">
        <div class="lk-avatar-border">
          <img src="" alt="" class="lk-profile-avatar">
        </div>
        <span class="lk-username"></span>
      </div>

      <div class="lk-profile-details">
        <!-- İsim, Follow & Opsiyonlar -->
        <div class="lk-profile-title-bar">
          <h1 class="lk-profile-fullname"></h1>
          <button class="lk-btn-follow-pill" type="button"></button>
          <button class="lk-btn-more" type="button" aria-label="Seçenekler">...</button>
        </div>

        <!-- İstatistikler -->
        <div class="lk-profile-stats">
          <span class="paylasim-sayi"><strong></strong> paylaşım</span>
          <span class="takipci-sayi"><strong></strong> followers</span>
          <span class="takip-edilen-sayi"><strong>280</strong> following</span>
        </div>

        <!-- Sosyal Medya İkonu -->
        <div class="lk-profile-social">
          <a href="#" target="_blank" rel="noopener noreferrer">
            <img src="images/instagram-icon.jpg" alt="Instagram">
          </a>
        </div>
      </div>
    </section>

    <!-- KOMBİNLER  -->
    <section class="lk-profile-grid">
      <div class="lk-post-card">
        <img src="" alt="Kombin" class="lk-post-img">
        <a href="detail.html" class="lk-btn-card-incele">İncele</a>
      </div>

      <div class="lk-post-card">
        <img src="" alt="Kombin" class="lk-post-img">
        <a href="detail.html" class="lk-btn-card-incele">İncele</a>
      </div>

      <div class="lk-post-card">
        <img src="" alt="Kombin" class="lk-post-img">
        <a href="detail.html" class="lk-btn-card-incele">İncele</a>
      </div>

      <div class="lk-post-card">
        <img src="" alt="Kombin" class="lk-post-img">
        <a href="detail.html" class="lk-btn-card-incele">İncele</a>
      </div>

      <div class="lk-post-card">
        <img src="" alt="Kombin" class="lk-post-img">
        <a href="detail.html" class="lk-btn-card-incele">İncele</a>
      </div>

    </section>

    </main>
    <script type="module" src="js/app.js"></script>
  </body>
  </html>
